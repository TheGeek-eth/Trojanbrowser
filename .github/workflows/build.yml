name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o TrojanBrowser-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
        working-directory: TrojanBrowser
      - uses: actions/upload-artifact@v4
        with:
          name: TrojanBrowser-apk
          path: TrojanBrowser/app/build/outputs/apk/release/*.apk
